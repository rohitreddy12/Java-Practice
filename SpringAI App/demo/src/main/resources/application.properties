spring.devtools.restart.enabled= true
#OpenAI Variables
spring.application.name=demo
spring.ai.openai.api-key = ${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

#Postgres Variables
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketingSystem
spring.datasource.username=springai
spring.datasource.password=1234
#db driver used
spring.datasource.driver-class-name=org.postgresql.Driver
#how schema is managed based on entities
spring.jpa.hibernate.ddl-auto=update
#log sql queries generated by Hibernate
spring.jpa.show-sql=true
#specifies the dialect to be used
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC